<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gesture Paint Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- MediaPipe scripts for client-side tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <div class="brand">
                <div class="brand-icon">✨</div>
                <h1>Gesture Canvas <span>Studio</span></h1>
            </div>
            <div class="status-pill">
                <span class="status-dot"></span>
                <span class="status-label">Mode:</span>
                <span id="mode-text" class="status-value">Starting camera...</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="feed-container">
            <div class="feed-wrapper" style="position: relative; width: 100%; height: 100%;">
                <video id="webcam" playsinline style="display: none;"></video>
                <canvas id="output_canvas" style="width: 100%; height: 100%; object-fit: contain;"></canvas>
            </div>
        </div>

        <aside class="controls-panel">
            <div class="panel-section">
                <h2 class="section-title">Brush & Eraser Settings</h2>
                
                <div class="control-group">
                    <label for="colorPicker">Brush Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="colorPicker" value="#a855f7">
                        <span class="color-preview" id="colorPreview" style="background-color: #a855f7;"></span>
                    </div>
                </div>

                <div class="control-group">
                    <div class="label-with-value">
                        <label for="sizeSlider">Brush Thickness</label>
                        <span id="sizeValue" class="slider-value">6px</span>
                    </div>
                    <input type="range" id="sizeSlider" min="2" max="50" value="6">
                </div>

                <div class="control-group">
                    <div class="label-with-value">
                        <label for="eraserSlider">Eraser Size</label>
                        <span id="eraserValue" class="slider-value">45px</span>
                    </div>
                    <input type="range" id="eraserSlider" min="15" max="150" value="45">
                </div>
            </div>

            <div class="panel-section">
                <h2 class="section-title">Display Toggles</h2>
                
                <div class="toggle-group">
                    <label for="camToggle">Camera Stream</label>
                    <label class="switch">
                        <input type="checkbox" id="camToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="toggle-group">
                    <label for="skeletonToggle">Hand Skeleton</label>
                    <label class="switch">
                        <input type="checkbox" id="skeletonToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="toggle-group">
                    <label for="isolateHandToggle">Isolate Skeleton Only</label>
                    <label class="switch">
                        <input type="checkbox" id="isolateHandToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="panel-section actions-section">
                <div class="action-grid">
                    <button class="btn btn-secondary" id="undoBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                        Undo
                    </button>
                    <button class="btn btn-secondary" id="redoBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
                        Redo
                    </button>
                    <button class="btn btn-danger" id="clearBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Clear Canvas
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const modeText = document.getElementById('mode-text');

        const colorPicker = document.getElementById('colorPicker');
        const colorPreview = document.getElementById('colorPreview');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const eraserSlider = document.getElementById('eraserSlider');
        const eraserValue = document.getElementById('eraserValue');
        const camToggle = document.getElementById('camToggle');
        const skeletonToggle = document.getElementById('skeletonToggle');
        const isolateHandToggle = document.getElementById('isolateHandToggle');

        // Dedicated drawing layer canvas
        const drawingCanvas = document.createElement('canvas');
        const drawingCtx = drawingCanvas.getContext('2d');

        // Tracking coordinates and smoothing variables
        let xp = 0, yp = 0;
        let smoothX = null, smoothY = null;
        let currentColor = colorPicker.value;
        let brushSize = parseInt(sizeSlider.value);
        let eraserRadius = parseInt(eraserSlider.value);
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 25;

        function saveHistory() {
            if (undoStack.length >= MAX_HISTORY) undoStack.shift();
            undoStack.push(drawingCtx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height));
            redoStack = [];
        }

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            colorPreview.style.backgroundColor = currentColor;
        });

        sizeSlider.addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            sizeValue.innerText = brushSize + 'px';
        });

        eraserSlider.addEventListener('input', (e) => {
            eraserRadius = parseInt(e.target.value);
            eraserValue.innerText = eraserRadius + 'px';
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            saveHistory();
            drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
        });

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (undoStack.length > 0) {
                redoStack.push(drawingCtx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height));
                const prev = undoStack.pop();
                drawingCtx.putImageData(prev, 0, 0);
            }
        });

        document.getElementById('redoBtn').addEventListener('click', () => {
            if (redoStack.length > 0) {
                undoStack.push(drawingCtx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height));
                const next = redoStack.pop();
                drawingCtx.putImageData(next, 0, 0);
            }
        });

        function onResults(results) {
            if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
                drawingCanvas.width = canvasElement.width;
                drawingCanvas.height = canvasElement.height;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Mirror preview horizontally for natural mirror interaction
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);

            const hasHands = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
            const isolateOnly = isolateHandToggle.checked;
            const showCam = camToggle.checked;

            // 1. BASE BACKGROUND: If Isolate Hand is active or camera is off, keep background solid dark
            if (!showCam || isolateOnly) {
                canvasCtx.fillStyle = '#090a0f';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
            } else {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            let eraserActive = false;
            let eraserPos = { x: 0, y: 0 };
            let hoverActive = false;
            let hoverPos = { x: 0, y: 0 };

            if (hasHands) {
                const landmarks = results.multiHandLandmarks[0];

                // 2. HAND SKELETON: Renders in normal mode if enabled, ALWAYS renders if Isolate Hand is active
                if (skeletonToggle.checked || isolateOnly) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#a855f7', lineWidth: 3 });
                    drawLandmarks(canvasCtx, landmarks, { color: '#ffffff', fillColor: '#38bdf8', lineWidth: 1.5, radius: 4 });
                }

                // Landmark detection states
                const indexUp = landmarks[8].y < landmarks[6].y;
                const middleUp = landmarks[12].y < landmarks[10].y;
                const ringUp = landmarks[16].y < landmarks[14].y;
                const pinkyUp = landmarks[20].y < landmarks[18].y;
                
                // Adaptive thumb detection (works for left and right hands)
                const isRightHand = landmarks[17].x > landmarks[5].x;
                const thumbUp = isRightHand ? landmarks[4].x < landmarks[3].x : landmarks[4].x > landmarks[3].x;

                const rawX = landmarks[8].x * canvasElement.width;
                const rawY = landmarks[8].y * canvasElement.height;

                // Center of palm for eraser positioning
                const palmX = ((landmarks[0].x + landmarks[5].x + landmarks[17].x) / 3) * canvasElement.width;
                const palmY = ((landmarks[0].y + landmarks[5].y + landmarks[17].y) / 3) * canvasElement.height;

                // 3. JITTER REMOVAL & SMOOTHING
                if (smoothX === null || smoothY === null) {
                    smoothX = rawX;
                    smoothY = rawY;
                } else {
                    const dist = Math.hypot(rawX - smoothX, rawY - smoothY);
                    if (dist > 2.0) {
                        const alpha = Math.min(0.65, Math.max(0.25, dist / 40));
                        smoothX = smoothX + alpha * (rawX - smoothX);
                        smoothY = smoothY + alpha * (rawY - smoothY);
                    }
                }

                // GESTURE MODES:
                // Open Palm -> Eraser
                if (indexUp && middleUp && ringUp && pinkyUp) {
                    modeText.innerText = "Eraser";
                    eraserActive = true;
                    eraserPos = { x: palmX, y: palmY };

                    // Erase drawn paint under palm area with dynamic radius
                    drawingCtx.save();
                    drawingCtx.globalCompositeOperation = 'destination-out';
                    drawingCtx.beginPath();
                    drawingCtx.arc(palmX, palmY, eraserRadius, 0, Math.PI * 2);
                    drawingCtx.fill();
                    drawingCtx.restore();

                    xp = 0; yp = 0;
                }
                // Thumb + Index -> Hover / Brush Preview
                else if (indexUp && thumbUp && !middleUp && !ringUp && !pinkyUp) {
                    modeText.innerText = "Hover";
                    hoverActive = true;
                    hoverPos = { x: smoothX, y: smoothY };
                    xp = 0; yp = 0;
                }
                // Index Finger Only -> Smooth Drawing
                else if (indexUp && !middleUp && !ringUp && !pinkyUp) {
                    modeText.innerText = "Drawing";

                    if (xp === 0 && yp === 0) {
                        saveHistory();
                        xp = smoothX;
                        yp = smoothY;
                    }

                    drawingCtx.strokeStyle = currentColor;
                    drawingCtx.lineWidth = brushSize;
                    drawingCtx.lineCap = 'round';
                    drawingCtx.lineJoin = 'round';
                    drawingCtx.beginPath();
                    drawingCtx.moveTo(xp, yp);
                    const midX = (xp + smoothX) / 2;
                    const midY = (yp + smoothY) / 2;
                    drawingCtx.quadraticCurveTo(xp, yp, midX, midY);
                    drawingCtx.stroke();

                    xp = midX;
                    yp = midY;
                } else {
                    modeText.innerText = "Idle";
                    xp = 0; yp = 0;
                }
            } else {
                modeText.innerText = "Searching Hand...";
                smoothX = null;
                smoothY = null;
                xp = 0; yp = 0;
            }

            // 4. COMPOSITE DRAWINGS OVER CAMERA / BLACK BACKGROUND
            canvasCtx.drawImage(drawingCanvas, 0, 0);

            // 5. ERASER HUD: Outer boundary overlay scales dynamically with eraserRadius
            if (eraserActive) {
                canvasCtx.save();
                canvasCtx.fillStyle = 'rgba(239, 68, 68, 0.25)';
                canvasCtx.beginPath();
                canvasCtx.arc(eraserPos.x, eraserPos.y, eraserRadius, 0, Math.PI * 2);
                canvasCtx.fill();

                canvasCtx.lineWidth = 2.5;
                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.setLineDash([6, 4]);
                canvasCtx.stroke();

                canvasCtx.beginPath();
                canvasCtx.arc(eraserPos.x, eraserPos.y, 4, 0, Math.PI * 2);
                canvasCtx.fillStyle = '#ef4444';
                canvasCtx.fill();
                canvasCtx.restore();
            }

            // 6. HOVER BRUSH PREVIEW RING
            if (hoverActive) {
                canvasCtx.save();
                canvasCtx.strokeStyle = currentColor;
                canvasCtx.lineWidth = 2;
                canvasCtx.beginPath();
                canvasCtx.arc(hoverPos.x, hoverPos.y, Math.max(3, brushSize / 2), 0, Math.PI * 2);
                canvasCtx.stroke();
                canvasCtx.restore();
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start();
    </script>
</body>
</html>
